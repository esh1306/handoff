<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monkey See, Monkey Do — workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light dark;
  /* instrument-console palette, light run: warm paper chassis, bold near-black ink, deep amber signal for anything live */
  --paper: #f5f1e6; --panel: #ffffff; --panel-2: #f7f3e7; --ink: #15130e; --muted: #55503f; --line: #ddd4bd;
  --blue: #a85b00; --blue-ink: #fff8ec; --pass: #146b39; --fail: #a52d16; --run: #a85b00;
  --chip: #eee6d0; --code: #f1ece0;
}
/* dark is opt-in only (data-theme="dark") so the demo doesn't depend on the presenter's OS setting */
:root[data-theme="dark"] {
  --paper: #15171a; --panel: #1b1e22; --panel-2: #22262b; --ink: #ece7dc; --muted: #8b9199; --line: #2f343b;
  --blue: #f2a93c; --blue-ink: #1a1206; --pass: #5ecb87; --fail: #ff6b52; --run: #f2a93c;
  --chip: #262a30; --code: #17191c;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 "IBM Plex Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: "IBM Plex Sans Condensed", "IBM Plex Sans", sans-serif; }

.app { display: grid; grid-template-columns: 340px minmax(0, 1fr); min-height: 100vh; }
@media (max-width: 900px) { .app { grid-template-columns: minmax(0, 1fr); } }

/* ---------- setup rail ---------- */
.rail { background: var(--panel); border-right: 1px solid var(--line); padding: 22px 20px; display: flex; flex-direction: column; gap: 22px; }
@media (max-width: 900px) { .rail { border-right: 0; border-bottom: 1px solid var(--line); } }
.brand { font-size: 21px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.brand + p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
form { display: grid; gap: 20px; }
.q { display: grid; gap: 9px; }
.q > h3 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-family: "IBM Plex Mono", monospace; }
.choices { display: grid; gap: 7px; }
.choice { position: relative; display: grid; grid-template-columns: 16px 1fr; gap: 2px 10px; align-items: start; padding: 10px 11px; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; background: var(--paper); }
.choice input { margin: 4px 0 0; accent-color: var(--blue); }
.choice b { font-weight: 700; font-size: 13.5px; }
.choice small { grid-column: 2; color: var(--muted); font-size: 12px; line-height: 1.4; }
.choice:has(input:checked) { border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); background: color-mix(in srgb, var(--blue) 7%, var(--paper)); }
.choice:has(input:disabled) { opacity: .45; cursor: not-allowed; }
.choice video { grid-column: 1 / -1; width: 100%; border-radius: 3px; margin-top: 6px; background: #000; aspect-ratio: 16/9; object-fit: cover; }
.upload { grid-column: 2; font-size: 12px; color: var(--muted); }
.upload input { max-width: 100%; margin-top: 4px; font-size: 12px; }
details.more summary { cursor: pointer; font-size: 13px; color: var(--muted); font-family: "IBM Plex Mono", monospace; }
.ds p { margin: 0 0 6px; }
.ds-form { display: flex; gap: 10px; align-items: flex-end; margin-top: 10px; }
.ds-form label { width: 120px; }
.ds-form .btn.primary { padding: 8px 16px; font-size: 13px; }
.bar { height: 8px; border-radius: 2px; background: var(--chip); overflow: hidden; margin: 8px 0; border: 1px solid var(--line); }
.bar span { display: block; height: 100%; background: var(--run); transition: width .3s; }
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
.ds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.ds-grid figure { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.ds-grid video { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 3px; background: #000; }
.ds-grid figcaption { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); font-family: "IBM Plex Mono", monospace; }
.box { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 16px 18px; }
.film-guide { font-size: 13px; padding: 2px 2px 0; }
.film-guide ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--muted); }
.film-guide b { color: var(--ink); font-weight: 600; }
.btn.present { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 600; }
details.more[open] summary { margin-bottom: 10px; }
label.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-family: "IBM Plex Mono", monospace; }
input[type=number], textarea { width: 100%; padding: 7px 9px; background: var(--paper); border: 1px solid var(--line); border-radius: 3px; font-family: "IBM Plex Sans"; }
textarea { resize: vertical; min-height: 50px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); background: var(--panel-2); border-radius: 3px; padding: 8px 13px; cursor: pointer; text-decoration: none; color: var(--ink); font-size: 13px; font-family: "IBM Plex Sans Condensed", sans-serif; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--blue); color: var(--blue-ink); border-color: var(--blue); font-weight: 700; padding: 12px; font-size: 14px; }
.btn.primary:disabled { opacity: .5; cursor: progress; }
.btn.danger:hover { border-color: var(--fail); color: var(--fail); }
.error { color: var(--fail); font-size: 13px; margin: 0; font-family: "IBM Plex Mono", monospace; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }

.runs h3 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-family: "IBM Plex Mono", monospace; margin-bottom: 8px; }
.runs ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.runs button { width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 4px; padding: 8px 9px; cursor: pointer; display: grid; grid-template-columns: 9px 1fr; gap: 0 9px; align-items: center; }
.runs button:hover { background: var(--chip); }
.runs button[aria-current="true"] { border-color: var(--line); background: var(--panel-2); }
.runs .t { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.runs .m { grid-column: 2; font-size: 11.5px; color: var(--muted); font-family: "IBM Plex Mono", monospace; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.s-running { background: var(--run); box-shadow: 0 0 6px 0 var(--run); animation: pulse 1.2s infinite; }
.s-done { background: var(--pass); box-shadow: 0 0 5px 0 var(--pass); } .s-failed { background: var(--fail); box-shadow: 0 0 5px 0 var(--fail); }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .s-running { animation: none; } }

/* ---------- main ---------- */
main { padding: 30px 34px 70px; min-width: 0; max-width: 1400px; }
.intro { max-width: 640px; margin: 8vh 0 0; }
.intro h2 { font-size: 34px; line-height: 1.14; font-weight: 600; margin-bottom: 14px; letter-spacing: -.005em; }
.intro p { color: var(--muted); max-width: 60ch; }
.how { list-style: none; padding: 0; margin: 22px 0; display: grid; gap: 14px; counter-reset: s; }
.how li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; }
.how li::before { content: counter(s); width: 30px; height: 30px; border-radius: 3px; border: 1px solid var(--line); background: var(--panel-2); display: grid; place-items: center; font: 600 13px "IBM Plex Mono", monospace; color: var(--muted); }
.how b { display: block; }
.how span { color: var(--muted); font-size: 14px; }

.head { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.head h2 { font-size: 24px; line-height: 1.22; font-weight: 600; max-width: 36ch; }
.meta { color: var(--muted); font-size: 12.5px; margin-top: 7px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-family: "IBM Plex Mono", monospace; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* workflow step bar: the three-step loop (set up -> run -> training data) */
.stepbar { display: flex; align-items: center; gap: 0; margin: 0 0 28px; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: 9px; background: none; border: 0; padding: 4px 0; cursor: pointer; }
.step:disabled { cursor: default; }
.step-n { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--panel); display: grid; place-items: center; font: 700 12px "IBM Plex Mono", monospace; color: var(--muted); flex: none; }
.step-l { font: 700 13px "IBM Plex Sans Condensed", sans-serif; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.step.is-active .step-n { border-color: var(--blue); background: var(--blue); color: var(--blue-ink); }
.step.is-active .step-l { color: var(--ink); }
.step.is-past .step-n { border-color: var(--pass); background: var(--pass); color: #fff; }
.step.is-past .step-l { color: var(--ink); }
.step-arrow { color: var(--line); font-size: 16px; margin: 0 14px; }
@media (max-width: 700px) { .stepbar { gap: 8px 0; } .step-arrow { margin: 0 6px; } .step-l { display: none; } }

/* launch screen: the pipeline, shown as connected nodes, while a fresh run spins up */
.launch { max-width: 760px; margin: 6vh 0 0; }
.launch h2 { font-size: 28px; font-weight: 600; margin: 6px 0 26px; }
.pipeline { display: flex; align-items: center; flex-wrap: wrap; gap: 0; }
.pnode { background: var(--panel); border: 1.5px solid var(--line); border-radius: 6px; padding: 12px 16px; font: 700 12.5px "IBM Plex Sans Condensed", sans-serif; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); opacity: 0; animation: node-in .4s ease-out forwards; }
.pnode.lit { border-color: var(--blue); color: var(--ink); background: color-mix(in srgb, var(--blue) 10%, var(--panel)); }
.parrow { color: var(--line); font-size: 18px; margin: 0 10px; opacity: 0; animation: node-in .4s ease-out forwards; }
@keyframes node-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .pnode, .parrow { animation: none; opacity: 1; } }
@media (max-width: 760px) { .pipeline { flex-direction: column; align-items: flex-start; } .parrow { transform: rotate(90deg); margin: 4px 0 4px 10px; } }

/* lamp-rail: the loop is a real five-stage sequence, shown as a panel of indicator lamps */
.lamprail { margin: 22px 0 4px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
@media (max-width: 760px) { .lamprail { grid-template-columns: repeat(2, 1fr); } }
.lamp { background: var(--panel-2); padding: 13px 14px 12px; position: relative; }
.lamp .idx { position: absolute; top: 10px; right: 11px; font: 10.5px "IBM Plex Mono", monospace; color: var(--muted); }
.lamp-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.lamp-light { width: 8px; height: 8px; border-radius: 50%; background: var(--line); box-shadow: inset 0 0 0 1px rgba(0,0,0,.3); flex: none; }
.lamp b { font: 700 11px "IBM Plex Mono", monospace; letter-spacing: .07em; text-transform: uppercase; }
.lamp small { color: var(--muted); font-size: 11.5px; line-height: 1.35; display: block; }
.lamp.is-active { background: color-mix(in srgb, var(--run) 13%, var(--panel-2)); }
.lamp.is-active .lamp-light { background: var(--run); box-shadow: 0 0 0 3px color-mix(in srgb, var(--run) 25%, transparent), 0 0 8px 0 var(--run); animation: lamp-pulse 1.7s ease-in-out infinite; }
.lamp.is-active b { color: var(--run); }
.lamp.is-done .lamp-light { background: var(--pass); box-shadow: 0 0 6px 0 var(--pass); }
.lamp.is-done b::after { content: " \2713"; color: var(--pass); }
.lamp.is-failed { background: color-mix(in srgb, var(--fail) 13%, var(--panel-2)); }
.lamp.is-failed .lamp-light { background: var(--fail); box-shadow: 0 0 6px 0 var(--fail); }
.lamp.is-failed b { color: var(--fail); }
@keyframes lamp-pulse { 50% { opacity: .4; } }
@media (prefers-reduced-motion: reduce) { .lamp.is-active .lamp-light { animation: none; } }

.now { margin: 12px 0 0; font: 13px "IBM Plex Mono", monospace; color: var(--ink); display: flex; gap: 9px; align-items: baseline; }
.now::before { content: "\203A"; color: var(--run); font-weight: 700; }
.now.is-live::after { content: ""; display: inline-block; width: 6px; height: 12px; background: var(--run); animation: caret 1s step-end infinite; }
@keyframes caret { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .now.is-live::after { animation: none; } }
.now time { color: var(--muted); font-size: 11.5px; }

.verdict { margin: 24px 0 16px; padding: 16px 18px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel-2); border-left: 3px solid var(--muted); }
.verdict.pass { border-left-color: var(--pass); } .verdict.fail { border-left-color: var(--fail); }
.verdict h3 { font-size: 17px; font-weight: 600; }
.verdict ul { margin: 8px 0 0; padding-left: 18px; }
.verdict li { margin: 2px 0; }
.verdict li.ok::marker { color: var(--pass); } .verdict li.no::marker { color: var(--fail); }
.verdict .hint { margin-top: 6px; }

.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 1000px) { .duo { grid-template-columns: 1fr; } }
.duo figure { margin: 0; }
.duo figcaption { font-weight: 600; font-size: 12.5px; margin-bottom: 7px; display: flex; justify-content: space-between; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: .05em; }
.duo figcaption .tag { font: 600 10.5px "IBM Plex Mono", monospace; color: var(--muted); letter-spacing: .06em; text-transform: none; background: var(--chip); border: 1px solid var(--line); border-radius: 99px; padding: 2px 8px; }
.duo video { width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 4px; display: block; object-fit: contain; border: 1px solid var(--line); }
.placeholder { aspect-ratio: 4/3; border-radius: 4px; border: 1px dashed var(--line); display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; padding: 20px; font-family: "IBM Plex Mono", monospace; }

h3.sec { font-size: 14px; font-weight: 600; margin: 36px 0 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.rounds { list-style: none; padding: 0; margin: 0; display: grid; gap: 7px; }
.rounds button { width: 100%; text-align: left; cursor: pointer; display: grid; grid-template-columns: 90px 130px 1fr; gap: 12px; align-items: start; padding: 10px 14px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); }
@media (max-width: 700px) { .rounds button { grid-template-columns: 1fr; } }
.rounds button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.rounds b { font-weight: 600; font-family: "IBM Plex Mono", monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.ok { color: var(--pass); } .no { color: var(--fail); }
.rounds .ch { color: var(--muted); font-size: 13px; }

.film { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(130px, 1fr); gap: 2px; overflow-x: auto; padding-bottom: 6px; background: var(--line); border: 1px solid var(--line); border-radius: 4px; }
.film figure { margin: 0; background: var(--panel-2); }
.film img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: var(--chip); cursor: zoom-in; }
.film figcaption { font-size: 10.5px; color: var(--muted); line-height: 1.3; padding: 4px 6px; font-family: "IBM Plex Mono", monospace; }
.strip-title { font-size: 11px; font-weight: 700; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-family: "IBM Plex Mono", monospace; }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 8px 4px; margin-right: 14px; cursor: pointer; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; font-weight: 600; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--run); }
.panel { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; overflow: auto; max-height: 70vh; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; font-family: "IBM Plex Mono", monospace; }
th { position: sticky; top: 0; background: var(--panel-2); color: var(--ink); font-weight: 700; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }
td.num { text-align: right; white-space: nowrap; }
td .why { color: var(--muted); font-size: 11.5px; font-family: "IBM Plex Sans"; }
.bad { color: var(--fail); font-weight: 600; }
pre { margin: 0; padding: 14px; font: 12.5px/1.6 "IBM Plex Mono", ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; background: var(--code); }
.log { list-style: none; margin: 0; padding: 0; }
.log li { padding: 7px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; display: grid; grid-template-columns: 70px 120px 1fr; gap: 10px; font-family: "IBM Plex Mono", monospace; }
.log time { color: var(--muted); }

dialog { border: 0; padding: 0; background: transparent; max-width: 92vw; }
dialog::backdrop { background: rgb(0 0 0 / .8); }
dialog img { max-width: 92vw; max-height: 86vh; display: block; border-radius: 4px; border: 1px solid var(--line); }
dialog p { color: #fff; margin: 8px 0 0; font-size: 13px; font-family: "IBM Plex Mono", monospace; }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div>
      <h1 class="brand">Monkey See, Monkey Do</h1>
      <p>Film a person doing a task. Get a robot doing it in simulation.</p>
    </div>

    <form id="form">
      <div class="q">
        <h3>Video of the task</h3>
        <div class="choices" id="videoChoices"></div>
      </div>
      <div class="q">
        <h3>Robot</h3>
        <div class="choices" id="robotChoices"></div>
      </div>
      <div class="q">
        <h3>AI model</h3>
        <div class="choices" id="modelChoices"></div>
      </div>
      <details class="more">
        <summary>More options</summary>
        <div style="display:grid;gap:10px">
          <label class="f">Describe the task (optional, helps the model)
            <textarea name="task" placeholder="e.g. puts the red cube in the bowl"></textarea>
          </label>
          <div class="row">
            <label class="f">Max rounds <input type="number" name="iters" value="5" min="1" max="20"></label>
            <label class="f">Frames per round <input type="number" name="frames" value="8" min="2" max="24"></label>
          </div>
          <p class="hint">Each round costs one model call. The loop stops early once the robot succeeds.</p>
        </div>
      </details>
      <button class="btn primary" id="start" type="submit">Make the robot do it</button>
      <p class="error" id="formError" role="alert"></p>
    </form>

    <nav class="runs" aria-label="Past runs">
      <h3>Past runs</h3>
      <ul id="runList"></ul>
    </nav>
  </aside>

  <main id="main"></main>
</div>

<dialog id="zoom"><img id="zoomImg" alt=""><p id="zoomCap"></p></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clock = t => new Date(t * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});
const ago = s => s < 60 ? `${Math.round(s)} s` : `${Math.floor(s / 60)} min ${Math.round(s % 60)} s`;
const ROBOT_NAMES = {panda: "Franka Panda", qarm: "QArm"};
const ROBOT_ABOUT = {panda: "7-joint arm, grips from above. Most reliable.", qarm: "Your 4-joint arm. Grips from the side, so some tasks won't work."};
const nice = s => String(s || "").replace(/_/g, " ");

const state = { config: null, runs: [], current: null, detail: null, round: null, tab: "steps", source: null, timer: null, phase: "setup" };

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let msg = r.statusText;
    try { msg = (await r.json()).detail || msg; } catch {}
    throw new Error(msg);
  }
  return r.json();
}

/* ---------- setup form ---------- */
function setupForm() {
  const c = state.config;
  $("#videoChoices").innerHTML = c.samples.map((s, i) => `
    <label class="choice"><input type="radio" name="source" value="sample:${esc(s.id)}" ${i === 0 ? "checked" : ""}>
      <b>Sample: ${esc(s.label)}</b><small>A simulated hand doing the task, for trying things out.</small>
      <video src="${s.src}" muted loop playsinline preload="metadata" onmouseenter="this.play()" onmouseleave="this.pause()"></video>
    </label>`).join("") + `
    <label class="choice"><input type="radio" name="source" value="upload" ${c.samples.length ? "" : "checked"}>
      <b>My own video</b>
      <span class="upload">A 10 to 20 s phone clip of one hand doing a tabletop task. Phone .mov files are fine.
        <input type="file" id="video" accept="video/*"></span>
    </label>
    <details class="more film-guide"><summary>How to film it so the robot can copy it</summary>
      <ul>
        <li><b>Phone on a tripod or a stack of books</b>, 1 to 1.5 m away, looking at the table from the side and a little above. Don't move it.</li>
        <li><b>One hand, one object, one destination</b>: pick something up and put it in or on something else. Pick-and-place works best.</li>
        <li><b>Small, solid, brightly coloured objects</b> on a plain table: a block, a small box, a ball or a lemon, into a bowl, cup or tray. The robot's gripper opens 8 cm, so the thing it picks up must be narrower than that.</li>
        <li><b>Start with your hand out of the way</b>, move slowly and clearly, then pull your hand back at the end.</li>
        <li>Good, even light. Avoid shiny, see-through or very dark objects, and keep everything else off the table.</li>
        <li>Say what you're doing in <b>Describe the task</b> under More options. It helps the model a lot.</li>
      </ul>
    </details>`;
  $("#video").addEventListener("change", () => { $('input[value="upload"]').checked = true; });

  $("#robotChoices").innerHTML = Object.keys(c.robots).map((k, i) => `
    <label class="choice"><input type="radio" name="robot" value="${k}" ${i === 0 ? "checked" : ""}>
      <b>${esc(ROBOT_NAMES[k] || k)}</b><small>${esc(ROBOT_ABOUT[k] || "")}</small></label>`).join("");

  const firstAvail = c.models.find(m => m.available)?.id;
  $("#modelChoices").innerHTML = c.models.map(m => `
    <label class="choice"><input type="radio" name="model" value="${esc(m.id)}" ${m.id === firstAvail ? "checked" : ""} ${m.available ? "" : "disabled"}>
      <b>${esc(m.id)}</b><small>${esc(m.about)}${m.available ? "" : " (no API key on the server)"}</small></label>`).join("");

  $("#form").addEventListener("submit", async e => {
    e.preventDefault();
    $("#formError").textContent = "";
    const fd = new FormData(e.target);
    const source = fd.get("source");
    fd.delete("source");
    if (source === "upload") {
      const f = $("#video").files[0];
      if (!f) { $("#formError").textContent = "Choose a video file, or pick the sample."; return; }
      fd.set("video", f);
    } else {
      fd.set("sample", source.slice(7));
    }
    const btn = $("#start"); btn.disabled = true; btn.textContent = "Starting…";
    try {
      const { id } = await api("/api/runs", { method: "POST", body: fd });
      await loadRuns();
      state.current = id; state.phase = "launching";
      renderLaunching();
      setTimeout(() => selectRun(id), 1300);
    } catch (err) {
      $("#formError").textContent = err.message;
    } finally {
      btn.disabled = false; btn.textContent = "Make the robot do it";
    }
  });
}

/* ---------- past runs ---------- */
async function loadRuns() {
  state.runs = await api("/api/runs");
  $("#runList").innerHTML = state.runs.length ? state.runs.map(r => `
    <li><button data-id="${r.id}" aria-current="${r.id === state.current}">
      <span class="dot s-${r.status}"></span>
      <span class="t">${esc(r.task || (r.status === "running" ? "Running…" : "Untitled run"))}</span>
      <span class="m">${esc(ROBOT_NAMES[r.robot] || r.robot)}, ${esc(r.model)}, ${r.status === "running" ? "running" : r.all_success ? "succeeded" : r.status === "failed" ? "error" : r.status === "stopped" ? "stopped" : "did not succeed"}</span>
    </button></li>`).join("") : `<li class="hint">Nothing yet. Your runs will show up here.</li>`;
}
$("#runList").addEventListener("click", e => {
  const b = e.target.closest("button[data-id]");
  if (b) selectRun(b.dataset.id);
});

async function selectRun(id) {
  if (state.source) { state.source.close(); state.source = null; }
  state.current = id; state.round = null; state.detail = null; state.phase = "live";
  history.replaceState(null, "", "#" + id);
  await refresh();
  if (state.detail?.status === "running") {
    const es = new EventSource(`/api/runs/${id}/events?start=${state.detail.events.length}`);
    let pending = null;
    es.onmessage = () => { clearTimeout(pending); pending = setTimeout(refresh, 200); };
    es.addEventListener("end", () => { es.close(); refresh(); loadRuns(); });
    state.source = es;
  }
  loadRuns();
}

async function refresh() {
  if (!state.current) { state.phase = "setup"; return renderApp(); }
  try {
    const prev = state.detail?.iterations?.length ?? 0;
    state.detail = await api(`/api/runs/${state.current}`);
    const n = state.detail.iterations.length;
    if (state.round === null || (state.round === prev && n > prev)) state.round = n;  // follow the newest round
    await loadDataset();
    renderApp();
  } catch (err) {
    $("#main").innerHTML = `<div class="intro"><h2>This run can't be opened</h2><p>${esc(err.message)}</p></div>`;
  }
}

/* ---------- workflow steps: set up -> run -> training data ---------- */
const STEPS = [
  {k: "setup", n: 1, l: "Set up"},
  {k: "live", n: 2, l: "Run"},
  {k: "training", n: 3, l: "Training data"},
];
function stepHeader(active) {
  const ai = STEPS.findIndex(s => s.k === active);
  const canTraining = state.detail?.status === "done" && state.detail?.all_success;
  return `<div class="stepbar" role="list" aria-label="Workflow">${STEPS.map((s, i) => {
    const cls = i === ai ? "is-active" : i < ai ? "is-past" : "";
    const clickable = s.k === "setup" || (s.k === "live" && state.current) || (s.k === "training" && canTraining);
    return `<button class="step ${cls}" data-phase="${s.k}" ${clickable ? "" : "disabled"} role="listitem"><span class="step-n">${i < ai ? "✓" : s.n}</span><span class="step-l">${esc(s.l)}</span></button>${i < STEPS.length - 1 ? `<span class="step-arrow">→</span>` : ""}`;
  }).join("")}</div>`;
}

function renderApp() {
  if (state.phase === "launching") return;
  if (!state.current || state.phase === "setup") return renderSetup();
  if (state.phase === "training") return renderTraining();
  return renderLive();
}

function renderSetup() {
  $("#main").innerHTML = `${stepHeader("setup")}<div class="intro">
    <h2>Show the AI a person doing a task, and it builds a robot simulation of the same task.</h2>
    <p>It works like the real2sim demos in Google's Gemini Argon post: the model keeps checking its simulation against your video and fixing it until the robot gets it right.</p>
    <ol class="how">
      <li><div><b>The model watches your video</b><span>It works out the objects (shape, size, colour, position) and what the person's hand did.</span></div></li>
      <li><div><b>It writes a scene and a robot plan</b><span>Steps like "move above the cube, move down 12 cm, close gripper", each with a reason.</span></div></li>
      <li><div><b>MuJoCo runs it with real physics</b><span>The robot really has to grip and carry things. We measure whether the task succeeded.</span></div></li>
      <li><div><b>The model compares and fixes</b><span>It sees the simulation next to your video plus the measurements, then tries again.</span></div></li>
    </ol>
    <p>To try it, keep the sample video selected and press <b>Make the robot do it</b>, over on the left.</p>
  </div>`;
}

function renderLaunching() {
  const nodes = ["Watch video", "Plan", "Simulate", "Compare & fix", "Result", "Export data"];
  $("#main").innerHTML = `${stepHeader("live")}<div class="launch">
    <h2>Lining up the pipeline…</h2>
    <div class="pipeline">${nodes.map((n, i) => `<div class="pnode${i === 0 ? " lit" : ""}" style="animation-delay:${i * 90}ms">${esc(n)}</div>${i < nodes.length - 1 ? `<span class="parrow" style="animation-delay:${i * 90 + 40}ms">→</span>` : ""}`).join("")}</div>
    <p class="hint" style="margin-top:22px">Your clip is uploading and the model is already starting to watch it — this won't take long.</p>
  </div>`;
}

/* ---------- what is happening right now ---------- */
function progress(d) {
  const ev = d.events, last = ev[ev.length - 1] || {};
  const stages = [
    {k: "watch", b: "Watch video", s: "Pull frames from your clip"},
    {k: "plan", b: "Plan", s: "Model writes scene and moves"},
    {k: "sim", b: "Simulate", s: "Robot tries it in MuJoCo"},
    {k: "fix", b: "Compare and fix", s: "Model checks against video"},
    {k: "done", b: "Result", s: ""},
  ];
  let active = "watch", now = "Starting up…";
  const round = ev.filter(e => e.type === "iteration").length;
  if (last.type === "frames") { active = "plan"; now = "Frames ready, sending them to the model."; }
  if (last.type === "model_call") {
    const first = last.stage === "analyse";
    active = first ? "plan" : "fix";
    now = first ? `${d.config.model} is watching your video and planning the robot's moves. This usually takes 20 to 90 s.`
                : `${d.config.model} is comparing round ${round} with your video and fixing the plan.`;
    if (last.attempt > 1) now += ` (retry ${last.attempt - 1}: its last answer wasn't usable)`;
  }
  if (last.type === "model_reply") { active = last.stage === "analyse" ? "plan" : "fix"; now = last.valid ? "Got the model's answer." : "The model's answer had problems; asking again."; }
  if (last.type === "iteration") { active = "sim"; now = `Round ${last.iteration}: the robot is trying the task in MuJoCo.`; }
  if (last.type === "simulated") { active = "sim"; now = `Round ${last.iteration} finished: ${last.all_success ? "success" : "not there yet"}.`; }
  if (d.status === "done") { active = "done"; now = ""; }
  if (d.status === "failed") { active = "failed"; now = last.message; }
  if (d.status === "stopped" || d.status === "interrupted") { active = "stopped"; now = d.status === "stopped" ? "You stopped this run." : "The server stopped before this run finished."; }
  const order = stages.map(s => s.k);
  const ai = order.indexOf(active);
  const since = last.t ? Date.now() / 1000 - last.t : 0;
  return { now, since, html: `<div class="lamprail" role="list" aria-label="Progress">${stages.map((s, i) => {
    let cls = "is-pending";
    if (active === "done" || (ai > i && ai >= 0)) cls = "is-done";
    if (s.k === active) cls = active === "done" ? "is-done" : "is-active";
    if ((active === "failed" || active === "stopped") && i === Math.max(0, order.indexOf(stageOf(last)))) cls = "is-failed";
    const sub = s.k === "done" ? (d.status === "done" ? (d.all_success ? "Robot succeeded" : "Ran out of rounds") : d.status === "running" ? "Waiting" : STATUS_WORD[d.status])
              : s.k === "sim" || s.k === "fix" ? (round ? `${s.s} · round ${round}` : s.s) : s.s;
    return `<div class="lamp ${cls}" role="listitem"><span class="idx">${i + 1}</span><div class="lamp-head"><span class="lamp-light"></span><b>${s.b}</b></div><small>${esc(sub)}</small></div>`;
  }).join("")}</div>` };
}
const STATUS_WORD = {failed: "Stopped by an error", stopped: "Stopped", interrupted: "Interrupted"};
const stageOf = e => e.type === "model_call" || e.type === "model_reply" ? (e.stage === "analyse" ? "plan" : "fix") : e.type === "iteration" || e.type === "simulated" ? "sim" : "watch";

/* ---------- results ---------- */
function checkSentence(c) {
  const o = nice(c.object);
  if (c.type === "object_on") return c.passed ? `The ${o} ended up on/in the ${nice(c.support)}.` : `The ${o} did not end up on/in the ${nice(c.support)} (${c.detail}).`;
  if (c.type === "object_lifted") return c.passed ? `The robot lifted the ${o} (${c.detail}).` : `The robot never lifted the ${o} high enough (${c.detail}).`;
  return c.passed ? `The ${o} reached its target spot (${c.detail}).` : `The ${o} missed its target spot (${c.detail}).`;
}

function stepProblems(m) {
  const out = [];
  for (const s of m?.steps || []) {
    if (s.reachable === false) out.push(`Step ${s.i} ("${s.language}") was out of the robot's reach.`);
    else if (s.tcp_error_mm > 20) out.push(`Step ${s.i} ("${s.language}") missed its target by ${s.tcp_error_mm} mm.`);
    if (s.action === "close" && !s.grasped.length) out.push(`Step ${s.i}: the gripper closed on nothing.`);
  }
  return out.slice(0, 4);
}

function renderLive() {
  const d = state.detail;
  const it = d.iterations[state.round - 1];
  const running = d.status === "running";
  const p = progress(d);
  const latest = d.iterations[d.iterations.length - 1];
  const title = latest?.spec?.task_description || d.task || "Working out what the person is doing…";

  let verdict = "";
  if (it?.metrics) {
    const m = it.metrics;
    if (m.error) verdict = `<div class="verdict fail"><h3>Round ${it.n}: the scene couldn't be simulated</h3><p>${esc(m.error)}</p></div>`;
    else {
      const probs = stepProblems(m);
      const cta = (d.status === "done" && d.all_success)
        ? `<p style="margin-top:12px"><button class="btn primary" data-act="goto-training">Next: make training data →</button></p>` : "";
      verdict = `<div class="verdict ${m.all_success ? "pass" : "fail"}">
        <h3>Round ${it.n}: ${m.all_success ? "the robot did the task" : "the robot didn't manage it yet"}</h3>
        <ul>${m.success.map(c => `<li class="${c.passed ? "ok" : "no"}">${esc(checkSentence(c))}</li>`).join("")}
            ${probs.map(t => `<li class="no">${esc(t)}</li>`).join("")}</ul>
        ${it.spec?.done != null ? `<p class="hint">The model ${it.spec.done ? "thinks this matches your video" : "thinks it needs more work"}.</p>` : ""}
        ${cta}
      </div>`;
    }
  }

  $("#main").innerHTML = `
    ${stepHeader("live")}
    <div class="head">
      <div>
        <h2>${esc(title)}</h2>
        <div class="meta">
          <span>${esc(ROBOT_NAMES[d.config.robot] || d.config.robot)} with ${esc(d.config.model)}</span>
          <span>Round ${d.iterations.length} of up to ${d.config.iters}</span>
          <span>Started ${clock(d.events[0]?.t || d.created)}</span>
        </div>
      </div>
      <div class="actions">
        ${running ? `<button class="btn danger" data-act="stop">Stop</button>` : ""}
        ${d.iterations.some(r => r.metrics?.steps) && !running ? `<a class="btn present" href="/demo#${d.id}" target="_blank">Present</a>` : ""}
        ${d.iterations.length ? `<button class="btn" data-act="replay" title="Opens an interactive MuJoCo window on this computer">Watch in 3D</button>` : ""}
        <a class="btn" href="/api/runs/${d.id}/zip" download>Download files</a>
        ${!running ? `<button class="btn danger" data-act="delete">Delete</button>` : ""}
      </div>
    </div>
    ${p.html}
    ${p.now ? `<p class="now${running ? " is-live" : ""}" id="now">${esc(p.now)} ${running ? `<time id="since">${ago(p.since)} ago</time>` : ""}</p>` : ""}

    ${verdict}
    <div class="duo">
      <figure><figcaption>Your video <span class="tag">source</span></figcaption>
        ${d.input_video ? `<video src="${d.input_video}" controls muted loop playsinline></video>` : `<div class="placeholder">Uploading…</div>`}</figure>
      <figure><figcaption>Robot in simulation <span class="tag">${it ? `round ${it.n}` : "—"}</span></figcaption>
        ${it?.video ? `<video src="${it.video}" controls muted loop autoplay playsinline></video>`
          : `<div class="placeholder">${running ? "The robot's attempt appears here as soon as the first round is simulated." : "No simulation for this run."}</div>`}</figure>
    </div>

    ${d.iterations.length ? `<h3 class="sec">Rounds</h3>
    <ul class="rounds">${d.iterations.map(r => {
      const m = r.metrics;
      const res = !m ? `<span>simulating…</span>` : m.error ? `<span class="no">couldn't simulate</span>` : m.all_success ? `<span class="ok">succeeded</span>` : `<span class="no">${m.success.filter(c => !c.passed).length} of ${m.success.length} checks failed</span>`;
      const ch = r.n === 1 ? "First attempt, from watching the video." : (r.spec?.changes || "");
      return `<li><button data-round="${r.n}" aria-pressed="${state.round === r.n}"><b>Round ${r.n}</b>${res}<span class="ch">${esc(ch)}</span></button></li>`;
    }).join("")}</ul>` : ""}

    ${it ? `<div class="strip-title">What the model saw in your video</div>${film(d.video_frames)}
            <div class="strip-title">What the robot did in round ${it.n}</div>${film(it.frames)}` :
      d.video_frames.length ? `<div class="strip-title">Frames sent to the model</div>${film(d.video_frames)}` : ""}

    <h3 class="sec">Details</h3>
    ${details(d, it)}
  `;
  clearInterval(state.timer);
  if (running) state.timer = setInterval(() => {
    const el = $("#since"), last = d.events[d.events.length - 1];
    if (el && last) el.textContent = ago(Date.now() / 1000 - last.t) + " ago";
  }, 1000);
}

/* ---------- step 3: training data ---------- */
function renderTraining() {
  const d = state.detail;
  $("#main").innerHTML = `
    ${stepHeader("training")}
    <div class="head">
      <div><h2>Turn this run into training data</h2>
        <div class="meta"><span>${esc(ROBOT_NAMES[d.config.robot] || d.config.robot)} with ${esc(d.config.model)}</span><span>All rounds passed</span></div>
      </div>
      <div class="actions"><button class="btn" data-act="back-to-live">← Back to run</button></div>
    </div>
    <div class="box" style="margin-bottom:22px">
      <p><b>Format:</b> LeRobot v2.1 — the dataset layout used to train VLAs such as pi0, SmolVLA and ACT.</p>
      <p class="hint">Each episode re-simulates the final plan with the objects moved, rotated and recoloured and the camera angle shifted. Only episodes where the robot still succeeds are kept, so every kept episode is a verified demonstration, not just a replay.</p>
    </div>
    ${datasetSection(d)}
    <p style="margin-top:28px"><button class="btn primary" data-act="new-run">Start another run →</button></p>
  `;
}

/* ---------- training dataset ---------- */
function datasetSection(d) {
  if (d.status !== "done" || !d.all_success) return "";
  const ds = state.ds || { status: "none" };
  const form = (label) => `
    <div class="ds-form">
      <label class="f">Episodes <input type="number" id="dsEpisodes" value="${ds.target || 50}" min="1" max="1000"></label>
      <button class="btn primary" data-act="dataset">${label}</button>
    </div>`;
  if (ds.status === "none") return `<div class="box ds">
      <p>Turn this run into a dataset for training robot policies (VLAs such as pi0, SmolVLA or ACT) in the LeRobot format.</p>
      <p class="hint">Each episode re-runs the robot with the objects moved, rotated and recoloured and the camera shifted. Only episodes where the robot still succeeds are kept. Every frame has a front and a wrist camera, joint positions, the commanded action, the task and the current language action. About 2 s per episode.</p>
      ${form("Make training data")}</div>`;
  if (ds.status === "running") {
    const pct = ds.target ? Math.round(100 * ds.kept / ds.target) : 0;
    return `<div class="box ds"><p><b>Making training data:</b> ${ds.kept} of ${ds.target} episodes kept${ds.tried ? `, ${ds.tried} tried` : ""}</p>
      <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
      <p class="hint">${esc(ds.message || "")}</p></div>`;
  }
  if (ds.status === "failed") return `<div class="box ds"><p class="bad">Couldn't make the dataset: ${esc(ds.message)}</p>${form("Try again")}</div>`;
  const s = ds.summary;
  const feats = Object.entries(ds.features || {}).filter(([k]) => !["timestamp", "frame_index", "episode_index", "index"].includes(k));
  return `<div class="box ds">
    <p><b>${s.episodes} episodes, ${s.frames.toLocaleString()} frames</b> at ${s.fps} fps, ${s.image_size[0]}×${s.image_size[1]} images.
      ${Math.round(s.success_rate * 100)}% of randomised attempts succeeded (${s.attempts} tried), made in ${Math.round(s.seconds)} s.</p>
    <div class="actions" style="margin:10px 0">
      <a class="btn primary" href="/api/runs/${d.id}/dataset/zip" download>Download dataset (LeRobot, zip)</a>
      <details class="more" style="align-self:center"><summary>Make it again</summary>${form("Regenerate")}</details>
    </div>
    <div class="ds-grid">${ds.preview.map(p => `<figure><video src="${p.front}" muted loop autoplay playsinline></video><video src="${p.wrist}" muted loop autoplay playsinline></video><figcaption>Episode ${p.episode}${p.episode === 0 ? " (original layout)" : ""}: front and wrist camera</figcaption></figure>`).join("")}</div>
    <table style="margin-top:12px"><thead><tr><th>Feature</th><th>Type</th><th>Contents</th></tr></thead><tbody>${feats.map(([k, f]) =>
      `<tr><td>${esc(k)}</td><td>${esc(f.dtype)}${f.dtype !== "video" && f.shape?.[0] > 1 ? ` [${f.shape[0]}]` : ""}</td><td class="why">${esc(f.dtype === "video" ? `${f.shape[1]}×${f.shape[0]} RGB` : (f.names || []).join(", "))}</td></tr>`).join("")}</tbody></table>
  </div>`;
}

async function loadDataset() {
  clearTimeout(state.dsTimer);
  if (!state.detail || state.detail.status !== "done") { state.ds = null; return; }
  try { state.ds = await api(`/api/runs/${state.current}/dataset`); } catch { state.ds = null; }
  if (state.ds?.status === "running") state.dsTimer = setTimeout(async () => { await loadDataset(); renderApp(); }, 1500);
}

function film(frames) {
  return frames.length ? `<div class="film">${frames.map(f => `<figure><img src="${f.src}" alt="${esc(f.label)}" loading="lazy" data-zoom><figcaption>${esc(f.label)}</figcaption></figure>`).join("")}</div>` : `<p class="hint">No frames yet.</p>`;
}

function details(d, it) {
  const tabs = [["steps", "Robot's plan"], ["objects", "Objects"], ["reply", "Model's answers"], ["spec", "Scene JSON"], ["activity", "Activity log"], ["log", "Process output"]];
  return `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${state.tab === k}">${l}</button>`).join("")}</div>
    <div class="panel" role="tabpanel">${tabBody(d, it)}</div>`;
}

function tabBody(d, it) {
  const spec = it?.spec, m = it?.metrics;
  switch (state.tab) {
    case "steps": {
      if (!spec) return `<pre>The plan appears once the model has answered.</pre>`;
      const res = m?.steps || [];
      return `<table><thead><tr><th>#</th><th>Step and the model's reason</th><th>Target</th><th class="num">Miss</th><th>Holding after</th></tr></thead><tbody>${
        spec.plan.map((s, i) => {
          const r = res[i] || {};
          const target = s.pos ? `(${s.pos.join(", ")}) m` : s.delta_cm ? `by (${s.delta_cm.join(", ")}) cm` : s.seconds ? `${s.seconds} s` : "";
          const miss = r.tcp_error_mm == null ? "" : `<span class="${r.reachable === false || r.tcp_error_mm > 20 ? "bad" : ""}">${r.tcp_error_mm} mm${r.reachable === false ? ", out of reach" : ""}</span>`;
          return `<tr><td>${i}</td><td>${esc(s.language || s.action)}<div class="why">${esc(s.reason)}</div></td><td>${esc(target)}${s.yaw != null ? `<div class="why">yaw ${s.yaw}°</div>` : ""}</td><td class="num">${miss}</td><td>${esc((r.grasped || []).map(nice).join(", ") || (m ? "nothing" : ""))}</td></tr>`;
        }).join("")}</tbody></table>`;
    }
    case "objects": {
      if (!spec) return `<pre>Objects appear once the model has answered.</pre>`;
      const o = m?.objects || {};
      return `<table><thead><tr><th>Object</th><th>Shape and size (half-extents, m)</th><th>Start (m)</th><th>End (m)</th><th class="num">Lifted</th></tr></thead><tbody>${
        spec.objects.map(ob => `<tr><td><span class="dot" style="background:rgb(${(ob.rgba || [.6,.6,.6]).slice(0, 3).map(v => Math.round(v * 255)).join(",")})"></span> ${esc(nice(ob.name))}${ob.fixed ? '<div class="why">fixed in place</div>' : ""}</td><td>${esc(ob.shape)} ${esc(ob.size.join(" × "))}</td><td>${esc((o[ob.name]?.initial || ob.pos).join(", "))}</td><td>${esc(o[ob.name]?.final?.join(", ") || "")}</td><td class="num">${o[ob.name] ? o[ob.name].max_lift_cm + " cm" : ""}</td></tr>`).join("")}</tbody></table>`;
    }
    case "reply": {
      const parts = [`First answer (from watching the video):\n\n${d.analysis || "Not yet."}`]
        .concat(d.iterations.filter(r => r.critique).map(r => `\n\n────────\nCritique after round ${r.n} (became round ${r.n + 1}):\n\n${r.critique}`));
      return `<pre>${esc(parts.join(""))}</pre>`;
    }
    case "spec": return `<pre>${esc(spec ? JSON.stringify(spec, null, 2) : "No scene yet.")}</pre>`;
    case "activity": return `<ul class="log">${d.events.map(e => `<li><time>${clock(e.t)}</time><b>${esc(nice(e.type))}</b><span>${esc(e.message || "")}</span></li>`).join("")}</ul>`;
    case "log": {
      const tb = d.events.find(e => e.traceback)?.traceback;
      return `<pre>${esc(d.process_log || "Empty.")}${tb ? "\n\n" + esc(tb) : ""}</pre>`;
    }
  }
}

$("#main").addEventListener("click", async e => {
  const phaseBtn = e.target.closest("[data-phase]");
  if (phaseBtn) {
    const target = phaseBtn.dataset.phase;
    if (target === "setup") { state.current = null; state.detail = null; history.replaceState(null, "", "#"); }
    state.phase = target;
    return renderApp();
  }
  const round = e.target.closest("[data-round]");
  if (round) { state.round = +round.dataset.round; return renderLive(); }
  const tab = e.target.closest("[data-tab]");
  if (tab) { state.tab = tab.dataset.tab; return renderLive(); }
  const img = e.target.closest("[data-zoom]");
  if (img) { $("#zoomImg").src = img.src; $("#zoomCap").textContent = img.alt; $("#zoom").showModal(); return; }
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (!act) return;
  if (act === "goto-training") { state.phase = "training"; return renderApp(); }
  if (act === "back-to-live") { state.phase = "live"; return renderApp(); }
  if (act === "new-run") {
    state.current = null; state.detail = null; state.phase = "setup"; history.replaceState(null, "", "#");
    renderApp(); return loadRuns();
  }
  const id = state.current;
  try {
    if (act === "stop") await api(`/api/runs/${id}/stop`, { method: "POST" });
    if (act === "replay") await api(`/api/runs/${id}/replay` + (state.round ? `?iteration=${state.round}` : ""), { method: "POST" });
    if (act === "dataset") {
      const n = Math.max(1, Math.min(1000, +($("#dsEpisodes")?.value || 50)));
      await api(`/api/runs/${id}/dataset?episodes=${n}`, { method: "POST" });
    }
    if (act === "delete") {
      if (!confirm("Delete this run and all its files?")) return;
      await api(`/api/runs/${id}`, { method: "DELETE" });
      state.current = null; state.detail = null; state.phase = "setup"; history.replaceState(null, "", "#");
      await loadRuns(); return renderApp();
    }
    refresh(); loadRuns();
  } catch (err) { alert(err.message); }
});
$("#zoom").addEventListener("click", () => $("#zoom").close());

(async () => {
  state.config = await api("/api/config");
  setupForm();
  await loadRuns();
  const id = location.hash.slice(1);
  if (id && state.runs.some(r => r.id === id)) selectRun(id); else renderApp();
})();
</script>
</body>
